<!-- Changelog Wrapper (Container Principal) -->
<div class="changelog-wrapper">
  <!-- Subtle Footer button -->
  <button class="changelog-btn" (click)="togglePopup()" aria-label="Histórico de atualizações">
    <span class="version-text">Versão 1.2.0 - Histórico</span>
  </button>

  <!-- Changelog Popup Panel -->
  <div class="changelog-panel" *ngIf="isPopupOpen">
    <div class="panel-header">
      <h3>Atualizações do Sistema</h3>
      <button class="close-btn" (click)="closePopup()">✕</button>
    </div>
    
    <div class="panel-body">
      <div class="update-item" *ngFor="let update of updates">
        <div class="update-meta">
          <span class="update-date">{{ update.data }}</span>
          <span class="update-badge" [ngClass]="update.tipo.toLowerCase()">{{ update.tipo }}</span>
          <span class="update-version">{{ update.version }}</span>
        </div>
        <p class="update-text">{{ update.texto }}</p>
      </div>
    </div>
  </div>
</div>
