<div class="project-card" [class.lang-csharp]="project.language === 'C#' || project.technology === 'C#'" [class.has-preview]="!!project.previewUrl">
  <div class="card-image-wrapper" (mouseenter)="isHovered.set(true)" (mouseleave)="isHovered.set(false)">
    <!-- Placeholder ou Imagem Estática -->
    <img [src]="project.imageUrl" [alt]="'Demonstração de ' + project.title" class="project-image" [class.hidden]="project.previewUrl && isHovered()">
    
    <!-- Preview Dinâmico (Vídeo ou GIF) -->
    <ng-container *ngIf="project.previewUrl">
      <video *ngIf="isVideo(project.previewUrl)" 
             [src]="project.previewUrl" 
             autoplay loop muted playsinline 
             class="project-preview" 
             [class.visible]="isHovered()">
      </video>
      <img *ngIf="!isVideo(project.previewUrl)" 
           [src]="project.previewUrl" 
           class="project-preview" 
           [class.visible]="isHovered()">
    </ng-container>
    
    <div class="badges-container">
      <span class="tech-badge" [ngClass]="languageBadgeClass">
        {{ project.language || project.technology }}
      </span>
      <span class="tech-badge" [ngClass]="infraBadgeClass" *ngIf="project.infra">
        {{ project.infra }}
      </span>
    </div>
  </div>
  
  <div class="card-content">
    <h3 class="project-title">{{ project.title }}</h3>
    <p class="project-description">{{ project.description }}</p>
    
    <div class="card-actions">
      <a *ngIf="project.id === 1" (click)="navigateToProject()" class="btn-action btn-demo" style="cursor: pointer;">
        ▶ Ver Demo
      </a>
      <a *ngIf="project.id === 2" (click)="navigateToProject()" class="btn-action btn-demo" style="cursor: pointer;">
        ▶ Ver Demo
      </a>
      <a *ngIf="project.id === 3" (click)="navigateToProject()" class="btn-action btn-demo" style="cursor: pointer;">
        ▶ Ver Demo
      </a>

      <a [href]="project.repoUrl" target="_blank" rel="noopener noreferrer" class="btn-action btn-repo">
        <i class="fab fa-github"></i> GitHub
      </a>
    </div>
  </div>
</div>
