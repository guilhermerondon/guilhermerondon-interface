<section id="sobre" class="about-container">
  <div class="about-content glass-card">
    <h1>{{ langService.text().about_title }}</h1>
    <div class="bio-text">
      <p [innerHTML]="langService.text().about_desc1"></p>
      <p>{{ langService.text().about_desc2 }}</p>
    </div>

    <!-- Nova seção Tech Stack com Glow Effects -->
    <div class="tech-stack-section">
      <h2>{{ langService.text().tech_stack }}</h2>
      <div class="tech-grid">
        <!-- Backend -->
        <div class="tech-item tech-python">Python</div>
        <div class="tech-item tech-csharp">C#</div>
        <div class="tech-item tech-go">Go</div>

        <!-- Infra/Cloud -->
        <div class="tech-item tech-docker">Docker</div>
        <div class="tech-item tech-k8s">Kubernetes</div>
        <div class="tech-item tech-azure">Azure</div>
      </div>
    </div>
  </div>
</section>
