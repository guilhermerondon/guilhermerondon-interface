<section class="hero-container">
  <div class="hero-content">
    <div class="status-badge">
      <div class="led-pulse"></div>
      <span>{{ langService.text().hero_badge }}</span>
    </div>
    
    <h1>{{ langService.text().hero_title }}</h1>
    
    <p class="subtitle">
      {{ langService.text().hero_subtitle }}
    </p>
    
    <div class="tech-marquee font-mono">
      <span>[.NET]</span>
      <span>[Go]</span>
      <span>[Python]</span>
      <span>[Angular]</span>
      <span>[PostgreSQL]</span>
      <span>[Docker]</span>
    </div>

    <div class="cta-group">
      <a routerLink="/projetos" class="btn btn-primary glow-btn">{{ langService.text().btn_projects }}</a>
      <a routerLink="/sobre" class="btn btn-secondary">{{ langService.text().btn_about }}</a>
    </div>
  </div>
</section>
