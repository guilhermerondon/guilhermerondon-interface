<section id="projetos" class="projects-container">
  <header>
    <h1>{{ langService.text().projects_title }}</h1>
    <p>{{ langService.text().projects_subtitle }}</p>
  </header>

  <div class="projects-grid">
    @for (project of projects(); track project.id) {
      <app-project-card [project]="project"></app-project-card>
    } @empty {
      <p>{{ langService.text().projects_empty }}</p>
    }
  </div>


</section>
